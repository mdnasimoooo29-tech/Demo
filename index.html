<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qwn.si — Premium Domain</title>

<meta name="description"
content="Qwn.si is a premium domain name available for acquisition. Contact directly to make an offer.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:#05070c;

    color:#f7f8fc;

    font-family:"DM Sans",sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loader{
    position:fixed;
    inset:0;

    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#05070c;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-content{
    text-align:center;
}

.loader-logo{
    font-family:"Manrope",sans-serif;

    font-size:34px;
    font-weight:800;

    letter-spacing:-2px;
}

.loader-logo span{
    background:
        linear-gradient(
            120deg,
            #769cff,
            #a77bff,
            #62ddff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.loader-line{
    width:100px;
    height:1px;

    margin:22px auto 0;

    overflow:hidden;

    background:rgba(255,255,255,.10);
}

.loader-line::after{
    content:"";

    display:block;

    width:38%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #6d91ff,
            #b17cff
        );

    animation:loaderLine 1.15s ease-in-out infinite;
}

@keyframes loaderLine{

    0%{
        transform:translateX(-140%);
    }

    100%{
        transform:translateX(390%);
    }

}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;

    z-index:-10;

    overflow:hidden;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 38%,
            rgba(62,91,185,.14),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(126,67,220,.10),
            transparent 28%
        ),

        #05070c;
}


/* GRID */

.grid{
    position:absolute;
    inset:0;

    opacity:.12;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:80px 80px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 82%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 82%
        );
}


/* GLOW */

.glow{
    position:absolute;

    border-radius:50%;

    filter:blur(105px);

    pointer-events:none;
}

.glow-1{
    width:520px;
    height:520px;

    top:-310px;
    right:-150px;

    background:rgba(70,112,255,.18);

    animation:
        floatingGlow 10s ease-in-out infinite;
}

.glow-2{
    width:460px;
    height:460px;

    left:-180px;
    bottom:-280px;

    background:rgba(137,73,255,.15);

    animation:
        floatingGlow 13s ease-in-out infinite reverse;
}

@keyframes floatingGlow{

    0%,100%{
        transform:translate3d(0,0,0);
    }

    50%{
        transform:translate3d(0,30px,0);
    }

}


/* =========================================================
   ORBITS
========================================================= */

.orbit{
    position:absolute;

    width:850px;
    height:430px;

    right:-430px;
    top:90px;

    border:
        1px solid
        rgba(94,137,255,.18);

    border-radius:50%;

    transform:rotate(-25deg);

    animation:
        orbitMove 12s ease-in-out infinite;
}

.orbit::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:35px;
    right:160px;

    border-radius:50%;

    background:#83a8ff;

    box-shadow:
        0 0 15px #7297ff,
        0 0 35px rgba(91,126,255,.7);
}

.orbit-2{
    width:650px;
    height:300px;

    left:-400px;
    bottom:90px;

    top:auto;
    right:auto;

    border-color:
        rgba(158,108,255,.12);

    transform:rotate(25deg);

    animation-delay:-4s;
}

@keyframes orbitMove{

    0%,100%{
        transform:
            rotate(-25deg)
            translate(0,0);
    }

    50%{
        transform:
            rotate(-21deg)
            translate(-18px,20px);
    }

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    width:min(
        1120px,
        calc(100% - 40px)
    );

    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:92px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    animation:
        headerReveal .9s ease both;
}

.logo{
    font-family:"Manrope",sans-serif;

    font-size:22px;
    font-weight:800;

    letter-spacing:-1.2px;
}

.logo span{
    background:
        linear-gradient(
            120deg,
            #719aff,
            #a77bff,
            #62ddff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


/* AVAILABLE STATUS */

.availability-header{

    display:flex;

    align-items:center;

    gap:10px;

    padding:
        9px
        14px;

    border:
        1px solid
        rgba(110,145,255,.14);

    border-radius:999px;

    background:
        rgba(90,120,255,.035);

    color:#aeb8ca;

    font-size:9px;
    font-weight:700;

    letter-spacing:2.5px;

    text-transform:uppercase;

    backdrop-filter:blur(10px);
}

.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#39e987;

    box-shadow:
        0 0 0 4px
        rgba(57,233,135,.07),

        0 0 16px
        rgba(57,233,135,.7);

    animation:
        statusPulse 2s ease-in-out infinite;
}

@keyframes statusPulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.78);
    }

}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:
        calc(100vh - 92px);

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        75px 0
        100px;

    text-align:center;
}

.hero-inner{
    width:100%;
    max-width:950px;
}


/* EYEBROW */

.eyebrow{

    display:inline-flex;

    align-items:center;

    gap:15px;

    margin-bottom:27px;

    color:#adb7ca;

    font-size:10px;

    font-weight:700;

    letter-spacing:5px;

    text-transform:uppercase;

    animation:
        fadeUp .9s .1s ease both;
}

.eyebrow::before,
.eyebrow::after{

    content:"";

    width:40px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #66799f
        );
}

.eyebrow::after{

    background:
        linear-gradient(
            90deg,
            #66799f,
            transparent
        );
}


/* =========================================================
   DOMAIN
========================================================= */

.domain-wrap{

    position:relative;

    display:inline-block;

    animation:
        domainReveal
        1.15s
        cubic-bezier(.16,1,.3,1)
        both;
}

.domain{

    position:relative;

    z-index:2;

    margin:0;

    font-family:"Manrope",sans-serif;

    font-size:
        clamp(
            78px,
            14vw,
            166px
        );

    line-height:.86;

    letter-spacing:-9px;

    font-weight:800;

    color:#f8f9fc;

    text-shadow:
        0 1px 0
        rgba(255,255,255,.18);
}

.domain .extension{

    background:
        linear-gradient(
            125deg,
            #79a8ff 5%,
            #a275ff 52%,
            #5be2ff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 0 20px
            rgba(105,125,255,.25)
        );
}


/* DOMAIN GLOW */

.domain-glow{

    position:absolute;

    left:10%;
    right:10%;

    bottom:-30px;

    height:55px;

    background:
        radial-gradient(
            ellipse,
            rgba(75,120,255,.40),
            transparent 68%
        );

    filter:blur(18px);

    animation:
        domainGlow
        4s
        ease-in-out
        infinite;
}

@keyframes domainReveal{

    from{
        opacity:0;

        transform:
            translateY(35px)
            scale(.96);

        filter:blur(12px);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }

}

@keyframes domainGlow{

    0%,100%{
        opacity:.45;
        transform:scaleX(.8);
    }

    50%{
        opacity:1;
        transform:scaleX(1);
    }

}


/* =========================================================
   SALE COPY
========================================================= */

.sale-title{

    margin-top:38px;

    color:#f0f2f7;

    font-size:
        clamp(
            18px,
            2.5vw,
            24px
        );

    font-weight:600;

    letter-spacing:-.4px;

    animation:
        fadeUp .9s .25s ease both;
}

.sale-title strong{
    color:#fff;
}

.sale-description{

    max-width:590px;

    margin:
        13px
        auto
        0;

    color:#858fa3;

    font-size:14px;

    line-height:1.8;

    animation:
        fadeUp .9s .35s ease both;
}


/* NO FIXED PRICE */

.offer-status{

    display:inline-flex;

    align-items:center;

    margin-top:20px;

    padding:
        9px
        16px;

    border:
        1px solid
        rgba(105,143,255,.17);

    border-radius:999px;

    background:
        rgba(80,115,255,.045);

    color:#aebde0;

    font-size:9px;

    font-weight:800;

    letter-spacing:2.5px;

    animation:
        fadeUp .9s .4s ease both;
}


/* =========================================================
   CONTACT CARD
========================================================= */

.contact-card{

    width:min(
        760px,
        100%
    );

    margin:
        42px
        auto
        0;

    padding:25px;

    border:
        1px solid
        rgba(255,255,255,.11);

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.022)
        );

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.08);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    animation:
        panelReveal
        1s
        .45s
        cubic-bezier(.16,1,.3,1)
        both;
}

.contact-heading{

    color:#c4ccda;

    font-size:10px;

    font-weight:800;

    letter-spacing:4px;

    text-transform:uppercase;
}

.contact-subheading{

    margin-top:8px;

    color:#737e93;

    font-size:12px;
}


/* =========================================================
   CONTACT BUTTONS
========================================================= */

.contact-buttons{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;

    margin-top:21px;
}

.contact-button{

    position:relative;

    min-height:82px;

    display:flex;

    align-items:center;

    padding:
        13px
        16px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:18px;

    background:
        rgba(2,5,11,.48);

    text-align:left;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}


/* LIGHT SWEEP */

.contact-button::before{

    content:"";

    position:absolute;

    top:-80px;
    left:-150px;

    width:100px;
    height:230px;

    transform:rotate(24deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.13),
            transparent
        );

    transition:
        left .75s ease;
}

.contact-button:hover::before{
    left:120%;
}

.contact-button:hover{
    transform:translateY(-5px);
}


/* =========================================================
   ICON CONTAINER
========================================================= */

.icon{

    position:relative;

    width:52px;
    height:52px;

    flex:0 0 52px;

    display:grid;
    place-items:center;

    margin-right:15px;

    border-radius:15px;
}


/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp .icon{

    color:#35e983;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(39,226,122,.19),
            rgba(39,226,122,.025)
        );

    border:
        1px solid
        rgba(39,226,122,.20);

    box-shadow:
        inset 0 0 25px
        rgba(39,226,122,.05);
}

.whatsapp:hover{

    border-color:
        rgba(39,226,122,.55);

    box-shadow:
        0 18px 55px
        rgba(39,226,122,.10);
}


/* OFFICIAL-STYLE WHATSAPP MARK */

.whatsapp-svg{

    width:29px;
    height:29px;

    fill:currentColor;

    display:block;
}


/* =========================================================
   EMAIL
========================================================= */

.email .icon{

    color:#91a9ff;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(104,137,255,.23),
            rgba(104,137,255,.025)
        );

    border:
        1px solid
        rgba(104,137,255,.20);

    box-shadow:
        inset 0 0 25px
        rgba(104,137,255,.06);
}

.email:hover{

    border-color:
        rgba(110,140,255,.60);

    box-shadow:
        0 18px 55px
        rgba(91,116,255,.12);
}

.email-svg{

    width:27px;
    height:27px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.6;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================================================
   CONTACT TEXT
========================================================= */

.contact-copy{

    min-width:0;

    flex:1;
}

.contact-copy strong{

    display:block;

    color:#f4f6fb;

    font-size:14px;

    font-weight:700;

    margin-bottom:5px;
}

.contact-copy span{

    display:block;

    color:#858fa3;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* ARROW */

.arrow{

    width:35px;
    height:35px;

    flex:0 0 35px;

    display:grid;

    place-items:center;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:50%;

    color:#9ba5b7;

    font-size:16px;

    transition:.3s ease;
}

.contact-button:hover .arrow{

    color:#fff;

    transform:translateX(4px);

    border-color:
        rgba(255,255,255,.22);
}


/* =========================================================
   OFFER NOTE
========================================================= */

.offer{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;

    margin-top:23px;

    color:#667084;

    font-size:9px;

    font-weight:800;

    letter-spacing:3px;
}

.offer::before,
.offer::after{

    content:"";

    width:34px;
    height:1px;

    background:#2b3241;
}

.offer-note{

    margin-top:9px;

    color:#4f586b;

    font-size:10px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{

    min-height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    color:#515b6e;

    font-size:9px;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.footer-logo{

    color:#e1e5ed;

    font-family:"Manrope",sans-serif;

    font-size:14px;

    font-weight:800;

    letter-spacing:-.4px;

    text-transform:none;
}

.footer-logo span{
    color:#799cff;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes headerReveal{

    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes panelReveal{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.985);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .container{
        width:
            calc(100% - 28px);
    }

    header{
        height:76px;
    }

    .logo{
        font-size:19px;
    }

    .availability-header{

        padding:
            8px
            11px;

        font-size:7px;

        letter-spacing:1.8px;
    }

    .hero{

        min-height:auto;

        padding:
            62px
            0
            75px;
    }

    .eyebrow{

        font-size:8px;

        letter-spacing:3px;
    }

    .eyebrow::before,
    .eyebrow::after{

        width:22px;
    }

    .domain{

        font-size:
            clamp(
                66px,
                21vw,
                108px
            );

        letter-spacing:-5px;
    }

    .sale-title{
        font-size:17px;
    }

    .sale-description{

        font-size:12px;

        line-height:1.75;
    }

    .contact-card{

        padding:17px;

        border-radius:21px;
    }

    .contact-buttons{

        grid-template-columns:1fr;

        gap:10px;
    }

    .contact-button{

        min-height:74px;
    }

    .icon{

        width:47px;
        height:47px;

        flex-basis:47px;
    }

    .offer{

        font-size:8px;

        letter-spacing:2px;
    }

    footer{

        min-height:85px;

        flex-direction:column;

        justify-content:center;

        gap:8px;

        text-align:center;
    }

    .orbit{

        width:600px;
        height:300px;

        right:-360px;
    }

    .orbit-2{

        width:520px;
        height:240px;

        left:-350px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none!important;

        transition:none!important;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div class
